[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msgraph-tui"
version = "0.1.0"
description = "Graphdeck: a provider-transparent Microsoft 365 administration console for the terminal"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
]

[project.optional-dependencies]
live = ["msal>=1.28"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
graphdeck = "msgraph_tui.app.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msgraph_tui = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (line length): long, readable lines are used deliberately here.
# UP042 (StrEnum): changing (str, Enum) -> StrEnum can alter serialization.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]  # test helpers use patterns bugbear dislikes but that are fine

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
